name: One-time safe GUI workflows release v1.0.19
on:
  push:
    branches: [master]
    paths: [".github/workflows/bootstrap-v1.0.19.yml"]
permissions:
  actions: write
  contents: write
jobs:
  create-tag-and-dispatch:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag immutable v1.0.19 and trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/master'
          git merge-base --is-ancestor 852727b480bf852fe0ac5e352e2e617fd2b78a7f HEAD
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.19" >/dev/null 2>&1; then
            echo 'Existing release tag cannot be moved' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v1.0.19' -f sha="$GITHUB_SHA" >/dev/null
          gh workflow run mcp-release.yml --ref v1.0.19
