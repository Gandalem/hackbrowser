name: One-time GUI tab cleanup release v1.0.20
on:
  push:
    branches: [master]
    paths: [".github/workflows/bootstrap-v1.0.20.yml"]
permissions:
  actions: write
  contents: write
jobs:
  create-tag-and-dispatch:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag v1.0.20 and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e9b77c5c69a4cd95c4d636488c36d80d2c8aeb4b HEAD
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.20" >/dev/null 2>&1; then
            echo 'Release tag exists. Refusing to move.' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v1.0.20' -f sha="$GITHUB_SHA" >/dev/null
          gh workflow run mcp-release.yml --ref v1.0.20
