name: One-time HackBrowser v2.0.0-beta.1 release
on:
  push:
    branches: [master]
    paths: [".github/workflows/bootstrap-v2.0.0-beta.1.yml"]
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the tested agent-first beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f4408588921a1ad88779c8ad8137a579310f1a99 HEAD
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.0.0-beta.1" >/dev/null 2>&1; then
            echo 'Release tag already exists; refusing to retag' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v2.0.0-beta.1' -f sha="$GITHUB_SHA" >/dev/null
          gh workflow run mcp-release.yml --ref v2.0.0-beta.1
