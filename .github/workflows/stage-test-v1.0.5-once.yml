name: Stage-test MCP Apps compatibility (one-time)
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/stage-test-v1.0.5-once.yml'
permissions:
  contents: read
jobs:
  stage-test:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    environment: oci-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.5
      - name: Test v1.0.5 bridge on a separate loopback port
        env:
          DEPLOY_HOST: ${{ secrets.OCI_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEYS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST_KEYS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/id_ci_diag"
          printf '%s\n' "$DEPLOY_HOST_KEYS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ci_diag" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/id_ci_diag"' EXIT
          tar -czf /tmp/hb-stage.tar.gz -C MCP-Deployment/services/hackbrowser server.py screenshot_widget.html
          scp -i "$HOME/.ssh/id_ci_diag" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            /tmp/hb-stage.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/hb-stage-$GITHUB_RUN_ID.tar.gz"
          ssh -i "$HOME/.ssh/id_ci_diag" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -euo pipefail
          run_id="$1"
          archive="/tmp/hb-stage-$run_id.tar.gz"
          stage="$(mktemp -d /tmp/hb-stage.XXXXXX)"
          pid=""
          cleanup() {
            if [[ -n "$pid" ]]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi
            rm -rf -- "$stage" "$archive"
          }
          trap cleanup EXIT
          tar -xzf "$archive" -C "$stage"
          chmod 0755 "$stage"
          chmod 0644 "$stage/server.py" "$stage/screenshot_widget.html"
          sudo -n -u mcpstack -H env HACKBROWSER_MCP_PORT=8766 \
            /opt/mcp-deployment/runtime/venv-hackbrowser/bin/python "$stage/server.py" >"$stage/server.log" 2>&1 &
          pid="$!"
          for i in $(seq 1 30); do
            if curl -s --max-time 1 http://127.0.0.1:8766/mcp >/dev/null 2>&1; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          base="http://127.0.0.1:8766/mcp"
          meta={"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"safe-staging-probe","version":"1"}}
          def rpc(method,params):
              h={"Content-Type":"application/json","Accept":"application/json, text/event-stream","Mcp-Method":method,"MCP-Protocol-Version":"2026-07-28"}
              if method=="tools/call": h["Mcp-Name"]=params["name"]
              req=urllib.request.Request(base,data=json.dumps({"jsonrpc":"2.0","id":1,"method":method,"params":params}).encode(),headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=12) as r:
                      body=r.read().decode()
                      status=r.status
              except urllib.error.HTTPError as e:
                  status=e.code;body=e.read().decode(errors="replace")
              if body.lstrip().startswith(("event:","data:")):
                  body=next(line[5:].strip() for line in body.splitlines() if line.startswith("data:"))
              try: data=json.loads(body)
              except Exception: raise RuntimeError(f"{method}: HTTP {status}, non-JSON: {body[:150]}")
              if status!=200 or "error" in data:
                  raise RuntimeError(f"{method}: HTTP {status}, error={str(data.get('error'))[:300]}")
              return data.get("result",{})
          discovery=rpc("server/discover",{"_meta":meta})
          print("DISCOVERY: OK; UI capability present:", "io.modelcontextprotocol/ui" in str(discovery.get("capabilities",{})))
          tools=rpc("tools/list",{"_meta":meta}).get("tools",[])
          print("TOOLS:",len(tools),[t.get("name") for t in tools])
          preview=next((t for t in tools if t.get("name")=="browser_screenshot"),None)
          print("SCREENSHOT_UI_META:",preview.get("_meta",{}) if preview else "NOT_FOUND")
          response=rpc("tools/call",{"name":"browser_status","arguments":{},"_meta":meta})
          print("STATUS_CALL:",[x.get("type") for x in response.get("content",[])])
          if len(tools)!=8 or preview is None or response.get("isError"):
              raise RuntimeError("MCP Apps staging check failed")
          PY
          REMOTE
