name: One-time GUI usability release v1.0.18
on:
  push:
    branches: [master]
    paths: [".github/workflows/bootstrap-v1.0.18.yml"]
permissions:
  actions: write
  contents: write
jobs:
  create-tag-and-dispatch:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag v1.0.18 and dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c915a315aaa1a5ffdebdf7f24426c8324d206e62 HEAD
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.18" >/dev/null 2>&1; then
            echo 'Existing version tag must not be replaced' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v1.0.18' -f sha="$GITHUB_SHA" >/dev/null
          gh workflow run mcp-release.yml --ref v1.0.18
