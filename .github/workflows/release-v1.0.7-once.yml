name: Bootstrap v1.0.7 release (one-time)
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release-v1.0.7-once.yml'
permissions:
  contents: write
  actions: write
jobs:
  release:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create verified v1.0.7 tag and dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: d671ba8ff6df9cad064ddf9fad6a9a04e995bfb1
        run: |
          set -euo pipefail
          git fetch origin master --tags
          git merge-base --is-ancestor "$TARGET_SHA" origin/master
          test "$(git cat-file -t "$TARGET_SHA")" = commit
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.7 >/dev/null 2>&1; then
            echo "v1.0.7 already exists; refusing to retag" >&2
            exit 1
          fi
          git tag v1.0.7 "$TARGET_SHA"
          git push origin refs/tags/v1.0.7
          gh workflow run mcp-release.yml --repo "$GITHUB_REPOSITORY" --ref v1.0.7
          echo "Created v1.0.7 at $TARGET_SHA and dispatched release"
