name: MCP tagged release and OCI deployment

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: mcp-release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-and-package:
    name: CI - validate tagged source and build release files
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0
      - name: Validate version and release ancestry
        id: version
        env:
          VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Only version tags like v1.0.0 are deployable" >&2
            exit 1
          fi
          git fetch origin master
          git merge-base --is-ancestor HEAD origin/master || {
            echo "Release tag must refer to a commit already merged into master" >&2
            exit 1
          }
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Tag $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML Pillow
      - name: Run CI tests and capture real output
        working-directory: MCP-Deployment
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee evidence/ci-tests.log
          bash -n scripts/deploy_release.sh scripts/package_release.sh
          python -m py_compile scripts/check_calls.py scripts/render_evidence.py
          python scripts/render_evidence.py evidence/ci-tests.log evidence/ci-tests.png "Release CI | tagged source"
      - name: Create versioned release package and SHA256
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          bash MCP-Deployment/scripts/package_release.sh "$VERSION" "$GITHUB_SHA"
          cd dist
          sha256sum -c "mcp-deployment-$VERSION.tar.gz.sha256"
          test -f "mcp-deployment-$VERSION.tar.gz"
          test -f "mcp-deployment-$VERSION.tar.gz.sha256"
      - name: Upload immutable job artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tagged-release-bundle
          path: |
            dist/mcp-deployment-*.tar.gz
            dist/mcp-deployment-*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload presentation CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tagged-ci-evidence
          path: MCP-Deployment/evidence/
          if-no-files-found: ignore
          retention-days: 30

  github-release:
    name: Release - publish downloadable installer and checksums
    needs: validate-and-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested release files
        uses: actions/download-artifact@v4
        with:
          name: tagged-release-bundle
          path: dist
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate-and-package.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c "mcp-deployment-$VERSION.tar.gz.sha256"
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --verify-tag --title "MCP Deployment $VERSION" --generate-notes
          fi
          gh release upload "$VERSION" \
            "mcp-deployment-$VERSION.tar.gz" \
            "mcp-deployment-$VERSION.tar.gz.sha256" --clobber
          echo "### GitHub Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Files: versioned tar.gz + SHA-256 checksum" >> "$GITHUB_STEP_SUMMARY"

  deploy-oci:
    name: CD - update OCI from verified release and collect screenshots
    needs: [validate-and-package, github-release]
    if: vars.OCI_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: oci-production
    concurrency:
      group: oci-mcp-deploy
      cancel-in-progress: false
    steps:
      - name: Download exactly the tested release
        uses: actions/download-artifact@v4
        with:
          name: tagged-release-bundle
          path: dist
      - name: Validate SSH secrets are configured
        env:
          DEPLOY_HOST: ${{ secrets.OCI_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEYS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST_KEYS"
      - name: Apply release to OCI and verify MCP
        env:
          VERSION: ${{ needs.validate-and-package.outputs.version }}
          DEPLOY_HOST: ${{ secrets.OCI_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEYS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo "[START] Release $VERSION, commit $GITHUB_SHA" | tee evidence/oci-deploy.log
          cd dist
          sha256sum -c "mcp-deployment-$VERSION.tar.gz.sha256" 2>&1 | tee -a ../evidence/oci-deploy.log
          cd ..
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/id_ci_deploy"
          printf '%s\n' "$DEPLOY_HOST_KEYS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ci_deploy" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/id_ci_deploy"' EXIT
          if ! ssh-keygen -y -P "" -f "$HOME/.ssh/id_ci_deploy" >/dev/null 2>&1; then
            echo "[FAIL] OCI private key format is invalid or passphrase protected" | tee -a evidence/oci-deploy.log
            exit 1
          fi
          ssh_opts=(-i "$HOME/.ssh/id_ci_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          destination="$DEPLOY_USER@$DEPLOY_HOST"
          echo "[PASS] SSH key preflight" | tee -a evidence/oci-deploy.log
          scp "${ssh_opts[@]}" "dist/mcp-deployment-$VERSION.tar.gz" "$destination:mcp-deployment-$VERSION.tar.gz" 2>&1 | tee -a evidence/oci-deploy.log
          scp "${ssh_opts[@]}" "dist/mcp-deployment-$VERSION.tar.gz.sha256" "$destination:mcp-deployment-$VERSION.tar.gz.sha256" 2>&1 | tee -a evidence/oci-deploy.log
          echo "[PASS] Release and checksum transferred" | tee -a evidence/oci-deploy.log
          ssh "${ssh_opts[@]}" "$destination" "bash -s -- '$VERSION' '$GITHUB_SHA'" <<'REMOTE' 2>&1 | tee -a evidence/oci-deploy.log
          set -euo pipefail
          version="$1"
          commit="$2"
          archive="$HOME/mcp-deployment-$version.tar.gz"
          checksum="$archive.sha256"
          stage="$(mktemp -d)"
          trap 'rm -rf -- "$stage" "$archive" "$checksum"' EXIT
          (cd "$HOME" && sha256sum -c "$(basename "$checksum")")
          tar -xzf "$archive" -C "$stage"
          test "$(cat "$stage/MCP-Deployment/COMMIT")" = "$commit"
          test "$(cat "$stage/MCP-Deployment/VERSION")" = "$version"
          sudo -n flock -w 300 /var/lock/mcp-deployment-release.lock \
            bash "$stage/MCP-Deployment/scripts/deploy_release.sh" \
              "$stage/MCP-Deployment" "$commit" "$version"
          REMOTE
          echo "[PASS] RELEASE $VERSION deployed to OCI with all MCP health checks" | tee -a evidence/oci-deploy.log
          echo "### OCI Release Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- MCP: PocMap 22, HackBrowser 8, ZAP 17 + real tool calls" >> "$GITHUB_STEP_SUMMARY"
      - name: Render deployment log as slide-ready PNG
        if: always()
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check Pillow
          if [ -f evidence/oci-deploy.log ]; then
            mkdir -p evidence
            tar -xzf "dist/mcp-deployment-$(basename "$GITHUB_REF").tar.gz" MCP-Deployment/scripts/render_evidence.py
            python MCP-Deployment/scripts/render_evidence.py evidence/oci-deploy.log evidence/oci-deploy.png "Release CD | OCI MCP verification"
          fi
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tagged-oci-deploy-evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 30
