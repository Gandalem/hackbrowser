name: One-time MCP CAPTCHA routing fix release v1.0.14
on:
  push:
    branches: [master]
    paths: [".github/workflows/bootstrap-v1.0.14.yml"]
permissions:
  actions: write
  contents: write
jobs:
  create-tag-and-dispatch:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable v1.0.14 and start release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/master'
          git merge-base --is-ancestor fcafb0360e368bccedf3b0499aad7b67ead03628 HEAD
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.14" >/dev/null 2>&1; then
            echo 'v1.0.14 tag already exists' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v1.0.14' -f sha="$GITHUB_SHA" >/dev/null
          gh workflow run mcp-release.yml --ref v1.0.14
          echo 'Triggered tagged package and OCI deploy'
