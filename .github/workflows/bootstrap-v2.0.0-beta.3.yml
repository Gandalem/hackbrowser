name: One-time HackBrowser beta.3 user handoff release
on:
  push:
    branches: [master]
    paths: [".github/workflows/bootstrap-v2.0.0-beta.3.yml"]
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag v2.0.0-beta.3 and dispatch OCI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ec5e0b230831d48a82c315e7373b751c5eeb4cfc HEAD
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.0.0-beta.3" >/dev/null 2>&1; then
            echo 'Release tag already exists' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v2.0.0-beta.3' -f sha="$GITHUB_SHA" >/dev/null
          gh workflow run mcp-release.yml --ref v2.0.0-beta.3
