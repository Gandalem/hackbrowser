name: One-time GUI stability release v1.0.17
on:
  push:
    branches: [master]
    paths: [".github/workflows/bootstrap-v1.0.17.yml"]
permissions:
  actions: write
  contents: write
jobs:
  create-tag-and-dispatch:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag GUI stability release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1186f9d63f31484c1a69788918234a286d50c119 HEAD
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.17" >/dev/null 2>&1; then
            echo 'Release tag exists; refusing to overwrite' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v1.0.17' -f sha="$GITHUB_SHA" >/dev/null
          gh workflow run mcp-release.yml --ref v1.0.17
