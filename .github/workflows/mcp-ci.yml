name: MCP continuous integration

on:
  push:
    branches: [master]
    paths:
      - "MCP-Deployment/**"
      - ".github/workflows/mcp-ci.yml"
      - ".github/workflows/mcp-release.yml"
      - ".gitattributes"
      - "README.md"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    name: CI - source tests and release package
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: MCP-Deployment
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML "mcp>=2,<3" "websocket-client>=1.8,<2"
      - name: Run unit tests and preserve evidence
        run: |
          set -o pipefail
          mkdir -p evidence
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee evidence/ci-tests.log
      - name: Validate deploy and smoke scripts
        run: |
          bash -n scripts/deploy_release.sh scripts/package_release.sh
          python -m py_compile scripts/check_calls.py scripts/render_evidence.py
          python -c "import yaml; d=yaml.safe_load(open('../.github/workflows/mcp-release.yml')); assert 'validate-and-package' in d['jobs']; assert 'github-release' in d['jobs']; assert 'deploy-oci' in d['jobs']"
      - name: Create CI evidence screenshot
        if: always()
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if [ -f evidence/ci-tests.log ]; then
            python scripts/render_evidence.py evidence/ci-tests.log evidence/ci-tests.png "CI | ARM64 source validation"
          fi
      - name: Test versioned release archive and SHA-256
        working-directory: .
        run: |
          set -euo pipefail
          bash MCP-Deployment/scripts/package_release.sh snapshot "$GITHUB_SHA"
          (cd dist && sha256sum -c mcp-deployment-snapshot.tar.gz.sha256)
          cp dist/mcp-release.tar.gz mcp-release.tar.gz
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-release
          path: mcp-release.tar.gz
          retention-days: 7
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: MCP-Deployment/evidence/
          if-no-files-found: ignore
          retention-days: 30
      - name: CI job summary
        if: always()
        run: |
          echo "### MCP CI result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner: ubuntu-24.04-arm" >> "$GITHUB_STEP_SUMMARY"
          echo "- Evidence: ci-evidence artifact (tests log)" >> "$GITHUB_STEP_SUMMARY"


  bootstrap-v1-0-1-release:
    name: One-time v1.0.1 tag and deploy trigger
    needs: source-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit.message == 'Bootstrap v1.0.1 tag and deploy via Actions'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Create version tag from this tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v1.0.1" -f sha="$GITHUB_SHA"
          echo "Created v1.0.1 at `$GITHUB_SHA`" >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch release and OCI deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run mcp-release.yml --repo "$GITHUB_REPOSITORY" --ref v1.0.1
          echo "Dispatched tagged release workflow for v1.0.1" >> "$GITHUB_STEP_SUMMARY"
