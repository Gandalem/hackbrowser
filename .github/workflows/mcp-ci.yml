name: MCP package CI

on:
  push:
    branches: [master]
    paths:
      - "MCP-Deployment/**"
      - ".github/workflows/mcp-ci.yml"
      - ".gitattributes"
      - "README.md"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: MCP-Deployment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validate source package
        run: python -m unittest discover -s tests -p 'test_*.py' -v
