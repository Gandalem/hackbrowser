name: Cleanup MCP Apps staging (one-time)
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cleanup-hb-stage-once.yml'
permissions:
  contents: read
jobs:
  cleanup:
    if: github.repository == 'Gandalem/hackbrowser'
    environment: oci-production
    runs-on: ubuntu-24.04
    steps:
      - name: Stop only isolated HackBrowser staging process
        env:
          DEPLOY_HOST: ${{ secrets.OCI_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEYS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/id_ci_cleanup"
          printf '%s\n' "$DEPLOY_HOST_KEYS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ci_cleanup" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/id_ci_cleanup"' EXIT
          ssh -i "$HOME/.ssh/id_ci_cleanup" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "Before stage cleanup:"
          sudo -n ss -lntp '( sport = :8766 )' || true
          sudo -n pkill -u mcpstack -f '^/opt/mcp-deployment/runtime/venv-hackbrowser/bin/python /tmp/hb-stage\\.[^/]+/server\\.py$' || true
          echo "After stage cleanup:"
          sudo -n ss -lntp '( sport = :8766 )' || true
          echo "Production port 8765 unchanged"
          REMOTE
