name: One-time HackBrowser v2.0.0-beta.2 release
on:
  push:
    branches: [master]
    paths: [".github/workflows/bootstrap-v2.0.0-beta.2.yml"]
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag frame-aware semantic beta and dispatch OCI release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 780f16696ee4a3a8f00459ecfe92ab87acce57cb HEAD
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.0.0-beta.2" >/dev/null 2>&1; then
            echo 'Release tag exists, refusing to replace' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v2.0.0-beta.2' -f sha="$GITHUB_SHA" >/dev/null
          gh workflow run mcp-release.yml --ref v2.0.0-beta.2
