name: Bootstrap v1.0.8 release (one-time)
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release-v1.0.8-once.yml'
permissions:
  contents: write
  actions: write
jobs:
  release:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag verified v1.0.8 source and dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 19a39d08c645d52e8a14cd07dd109fe76a1c4d69
        run: |
          set -euo pipefail
          git fetch origin master --tags
          git merge-base --is-ancestor "$TARGET_SHA" origin/master
          test "$(git cat-file -t "$TARGET_SHA")" = commit
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.8 >/dev/null 2>&1; then
            echo "v1.0.8 already exists; refusing to retag" >&2
            exit 1
          fi
          git tag v1.0.8 "$TARGET_SHA"
          git push origin refs/tags/v1.0.8
          gh workflow run mcp-release.yml --repo "$GITHUB_REPOSITORY" --ref v1.0.8
          echo "Created v1.0.8 at $TARGET_SHA and dispatched release"
