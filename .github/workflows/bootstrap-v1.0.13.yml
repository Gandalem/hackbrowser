name: One-time CAPTCHA interaction release v1.0.13
on:
  push:
    branches: [master]
    paths: [".github/workflows/bootstrap-v1.0.13.yml"]
permissions:
  actions: write
  contents: write
jobs:
  create-tag-and-dispatch:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v1.0.13 tag and launch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/master'
          git merge-base --is-ancestor 60b32ecde2592547f85f39a0a57e00382965e6b9 HEAD
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.13" >/dev/null 2>&1; then
            echo 'v1.0.13 already exists; refusing to move existing tag' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v1.0.13' -f sha="$GITHUB_SHA" >/dev/null
          gh workflow run mcp-release.yml --ref v1.0.13
          echo 'Launched tagged release and conditional OCI deployment'
