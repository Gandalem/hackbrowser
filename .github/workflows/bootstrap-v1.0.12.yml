name: One-time GUI Chromium release v1.0.12
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/bootstrap-v1.0.12.yml"

permissions:
  actions: write
  contents: write

jobs:
  create-tag-and-dispatch:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete release ancestry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable release tag and dispatch verified release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/master'
          git merge-base --is-ancestor ec1c3f4cf978919e57901cb2834775b25adf54c6 HEAD
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.12" >/dev/null 2>&1; then
            echo "v1.0.12 already exists; refusing to move an existing release tag" >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v1.0.12' -f sha="$GITHUB_SHA" >/dev/null
          # workflow_dispatch events are allowed to initiate another workflow
          # even when the caller uses the repository GITHUB_TOKEN.
          gh workflow run mcp-release.yml --ref v1.0.12
          echo "Dispatched the existing tagged release and optional OCI deployment."
