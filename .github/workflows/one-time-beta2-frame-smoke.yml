name: One-time beta.2 iframe and shadow DOM semantic GUI smoke
on:
  push:
    branches: [master]
    paths: [".github/workflows/one-time-beta2-frame-smoke.yml"]
permissions:
  contents: read
jobs:
  smoke:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    environment: oci-production
    concurrency:
      group: oci-mcp-deploy
      cancel-in-progress: false
    steps:
      - name: Verify iframe and shadow semantic actions on a disposable GUI tab
        env:
          DEPLOY_HOST: ${{ secrets.OCI_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEYS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST_KEYS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/id_ci_deploy"
          printf '%s\n' "$DEPLOY_HOST_KEYS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ci_deploy" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/id_ci_deploy"' EXIT
          ssh -i "$HOME/.ssh/id_ci_deploy" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n -u mcpstack /opt/mcp-deployment/runtime/venv-hackbrowser/bin/python - <<'PY'
          import json
          import sys
          import time
          sys.path.insert(0, "/opt/mcp-deployment/services/hackbrowser")
          import server
          before = {x["target_id"] for x in server.browser_tabs()}
          new = server._browser_cdp("Target.createTarget", {"url": "about:blank"})
          tid = new["targetId"]
          try:
              js = """
              (() => {
                document.body.innerHTML = '<div id="shadow-host"></div><iframe id="child"></iframe>';
                const root = document.getElementById('shadow-host').attachShadow({mode:'open'});
                root.innerHTML = '<button id="shadow-button" type="button" aria-label="More">More</button><span id="shadow-result">Not clicked</span>';
                root.querySelector('button').addEventListener('click', () => root.querySelector('#shadow-result').textContent = 'Shadow clicked');
                document.getElementById('child').srcdoc = '<button type="button" aria-label="Expand" onclick="document.body.dataset.clicked=1">Expand</button>';
                return true;
              })()
              """
              for i in range(20):
                  try:
                      server._evaluate(js, tid)
                      break
                  except Exception:
                      if i == 19:
                          raise
                      time.sleep(.2)
              selected = None
              for i in range(30):
                  observation = server.browser_observe(target_id=tid, max_elements=20)
                  shadow = [e for e in observation.get("elements", [])
                            if e.get("name") == "More" and e.get("frame") == 0]
                  child = [e for e in observation.get("elements", [])
                           if e.get("name") == "Expand" and e.get("frame") == 1]
                  if shadow and child:
                      selected = observation
                      break
                  time.sleep(.2)
              assert selected, "Shadow DOM and iframe were not both observed"
              assert selected["frames_scanned"] >= 2
              assert "click" in shadow[0]["allowed_actions"]
              assert child[0]["in_viewport"]
              result = server.browser_act(
                  selected["snapshot_id"], child[0]["ref"], "click", target_id=tid
              )
              assert result.get("ok"), result
              assert server._evaluate(
                  "document.getElementById('child').contentDocument.body.dataset.clicked",
                  tid
              ) == "1", "iframe click was not observed"
              assert not server.browser_act(
                  selected["snapshot_id"], child[0]["ref"], "click", target_id=tid
              ).get("ok"), "Consumed iframe ref unexpectedly worked"
              print("PASS: iframe element observed, clicked once, and DOM verified")
              renewed = server.browser_observe(target_id=tid, max_elements=20)
              shadow2 = next(e for e in renewed["elements"]
                             if e["name"] == "More" and e["frame"] == 0)
              clicked = server.browser_act(
                  renewed["snapshot_id"], shadow2["ref"], "click", target_id=tid
              )
              assert clicked.get("ok"), clicked
              assert server._evaluate(
                  "document.getElementById('shadow-host').shadowRoot.querySelector('#shadow-result').textContent",
                  tid
              ) == "Shadow clicked"
              print("PASS: open shadow root observed, clicked, and DOM verified")
              old = server.browser_observe(target_id=tid, max_elements=20)
              child_old = next(e for e in old["elements"] if e["name"] == "Expand")
              server._evaluate(
                  "document.querySelector('#child').srcdoc = " + json.dumps('<button aria-label="Expand">Expand</button>'),
                  tid
              )
              time.sleep(.5)
              stale = server.browser_act(
                  old["snapshot_id"], child_old["ref"], "click", target_id=tid
              )
              assert not stale.get("ok"), stale
              print("PASS: stale iframe reference rejected")
          finally:
              server._browser_cdp("Target.closeTarget", {"targetId": tid})
          after = {x["target_id"] for x in server.browser_tabs()}
          assert after == before, "Original tabs changed"
          print("PASS: no original GUI tabs modified")
          PY
          REMOTE
