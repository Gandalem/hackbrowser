name: One-time Playwright GUI fix release v1.0.16
on:
  push:
    branches: [master]
    paths: [".github/workflows/bootstrap-v1.0.16.yml"]
permissions:
  actions: write
  contents: write
jobs:
  create-tag-and-dispatch:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable v1.0.16 and start release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/master'
          git merge-base --is-ancestor f12d5bac5afe6dac62edc52cc764ef2c1158f793 HEAD
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.16" >/dev/null 2>&1; then
            echo 'Existing tag v1.0.16 must never be replaced' >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v1.0.16' -f sha="$GITHUB_SHA" >/dev/null
          gh workflow run mcp-release.yml --ref v1.0.16
