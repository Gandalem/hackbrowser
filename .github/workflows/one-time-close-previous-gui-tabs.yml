name: One-time explicit GUI tab cleanup
on:
  push:
    branches: [master]
    paths: [".github/workflows/one-time-close-previous-gui-tabs.yml"]
permissions:
  contents: read
jobs:
  close-listed-tabs:
    if: github.repository == 'Gandalem/hackbrowser'
    runs-on: ubuntu-24.04
    environment: oci-production
    concurrency:
      group: oci-mcp-deploy
      cancel-in-progress: false
    steps:
      - name: Close exactly the three previously open page targets
        env:
          DEPLOY_HOST: ${{ secrets.OCI_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEYS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST_KEYS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/id_ci_deploy"
          printf '%s\n' "$DEPLOY_HOST_KEYS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ci_deploy" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/id_ci_deploy"' EXIT
          ssh -i "$HOME/.ssh/id_ci_deploy" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n -u mcpstack /opt/mcp-deployment/runtime/venv-hackbrowser/bin/python - <<'PY'
          import sys
          sys.path.insert(0, "/opt/mcp-deployment/services/hackbrowser")
          import server
          target_ids = [
              "EC7691FA30A041E9EC461DBC002B148A",
              "38ACBB4ED5B5ED7981F67F66989CD4C3",
              "1A3E66F6C058F325B102D5F89BDDC2D7",
          ]
          before = server.browser_tabs()
          ids = {tab["target_id"] for tab in before}
          if ids != set(target_ids) or any(
              tab["type"] != "page" for tab in before
          ):
              raise RuntimeError(
                  "Open tabs differ from the three explicitly approved IDs; no tabs closed"
              )
          result = server.browser_close_tabs(target_ids, keep_one_blank=True)
          after = server.browser_tabs()
          if result["closed"] != 3:
              raise RuntimeError("Not all requested tabs closed: " + str(result))
          if len(after) != 1 or after[0]["url"] != "about:blank":
              raise RuntimeError("Expected exactly one blank GUI tab: " + str(after))
          print("PASS: closed all three listed previous tabs; kept a blank GUI tab")
          print("Remaining page count:", len(after))
          print("CDP endpoint:", server.CDP_ROOT)
          PY
          REMOTE
