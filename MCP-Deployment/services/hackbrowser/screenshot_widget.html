<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HackBrowser Screenshot</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.45 system-ui, -apple-system, sans-serif; }
    html, body { box-sizing: border-box; width: 100%; min-width: 0; max-width: 100%; overflow-x: hidden; }
    body { margin: 0; padding: 10px; }
    .viewer { width: 100%; min-width: 0; max-width: 100%; box-sizing: border-box; }
    .preview { box-sizing: border-box; width: 100%; max-width: 100%; height: auto;
      max-height: var(--preview-max-height, 440px); object-fit: contain;
      border: 1px solid #8885; border-radius: 8px; display: none; background: #fff; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; min-width: 0; }
    @media (max-width: 480px) { body { padding: 6px; } .toolbar { gap: 6px; } }
    button { cursor: pointer; padding: 7px 12px; border: 1px solid #8887;
      border-radius: 6px; background: transparent; color: inherit; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    #status { margin: 0; color: inherit; opacity: .78; overflow-wrap: anywhere; }
    #details { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .7; }
    #verification-card { margin-top: 12px; padding: 12px; border: 1px solid #8886;
      border-radius: 8px; }
    #verification-card h2 { font-size: 15px; margin: 0 0 7px; }
    #verification-card p { margin: 7px 0; }
    #verification-answer { box-sizing: border-box; width: 100%; max-width: 320px;
      padding: 9px; border: 1px solid #8889; border-radius: 6px; font: inherit; }
    #verification-positions { overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    #verification-submit { margin-top: 8px; font-weight: 650; }
    #resume-agent { font-weight: 650; }
    .verification-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .verification-active { cursor: crosshair; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="viewer">
    <p id="status" role="status" aria-live="polite">캡처 이미지를 불러오는 중입니다.</p>
    <img id="preview" class="preview" alt="HackBrowser가 캡처한 실제 브라우저 화면" />
    <div class="toolbar">
      <button id="download" type="button" disabled>PNG 다운로드</button>
      <span id="details"></span>
    </div>
    <section id="verification-card" hidden aria-label="사용자 인증 입력">
      <h2>사용자 인증이 필요합니다</h2>
      <p>이미지 선택형 CAPTCHA는 <strong>이미지 직접 클릭</strong>을 사용하세요. 텍스트형 CAPTCHA는 아래에 답을 입력하고 화면에서 <strong>답 입력칸</strong>과
        <strong>확인 버튼</strong> 위치를 순서대로 클릭해 지정한 후 제출할 수 있습니다.</p>
      <label for="verification-answer">인증 답변</label>
      <input id="verification-answer" type="text" maxlength="64" autocomplete="off"
        autocapitalize="off" spellcheck="false" placeholder="화면에 표시된 답을 입력" />
      <div class="verification-controls">
        <button type="button" id="pick-input">① 답 입력칸 위치 선택</button>
        <button type="button" id="pick-confirm">② 확인 버튼 위치 선택</button>
      </div>
      <p id="verification-positions" role="status">입력칸: 미선택 / 확인 버튼: 미선택</p>
      <button id="verification-submit" type="button" disabled>인증 답변 제출</button>
      <div class="verification-controls">
        <button type="button" id="pick-tile">이미지 직접 클릭</button>
        <button type="button" id="refresh-verification">현재 화면 새로고침</button>
        <button type="button" id="resume-agent" hidden>인증 완료 · AI 작업 계속</button>
      </div>
      <p id="verification-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    "use strict";
    // The screenshot comes from the MCP tool result, not a public URL.
    // No cookies, bearer URLs or image bytes are sent to other servers.
    let imageBase64 = null;
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");
    const download = document.getElementById("download");
    const details = document.getElementById("details");
    const verificationCard = document.getElementById("verification-card");
    const verificationAnswer = document.getElementById("verification-answer");
    const verificationPositions = document.getElementById("verification-positions");
    const verificationStatus = document.getElementById("verification-status");
    const verificationSubmit = document.getElementById("verification-submit");
    const pickInput = document.getElementById("pick-input");
    const pickConfirm = document.getElementById("pick-confirm");
    const pickTile = document.getElementById("pick-tile");
    const refreshVerification = document.getElementById("refresh-verification");
    const resumeAgent = document.getElementById("resume-agent");
    let activeVerification = null;
    let inputPoint = null;
    let confirmPoint = null;
    let picking = null;
    let verificationSubmitting = false;
    let lastVerificationTarget = null;
    let pausedWorkflowId = null;
    let continueRequested = false;
    let autoResumeOnConfirmed = false;
    let hostInitialized = false;
    let hostSupportsDownload = null;
    let hostToolPrefix = "";
    let nextRequestId = 2;
    const pendingRequests = new Map();
    let lastReportedHeight = 0;
    let resizeQueued = false;

    // MCP Apps hosts can resize an inline iframe using this standard notification.
    // Report only content height: reporting viewport width can widen the iframe
    // and create the horizontal scrolling we are trying to remove.
    function reportHeight() {
      if (!hostInitialized) return;
      const height = Math.ceil(document.body.scrollHeight);
      if (height <= 0 || Math.abs(height - lastReportedHeight) < 2) return;
      lastReportedHeight = height;
      window.parent.postMessage({
        jsonrpc: "2.0",
        method: "ui/notifications/size-changed",
        params: { height },
      }, "*");
    }

    function scheduleHeightReport() {
      if (resizeQueued) return;
      resizeQueued = true;
      requestAnimationFrame(() => {
        resizeQueued = false;
        reportHeight();
      });
    }

    if (typeof ResizeObserver === "function") {
      new ResizeObserver(scheduleHeightReport).observe(document.body);
    }
    window.addEventListener("resize", scheduleHeightReport);

    function applyHostHeightLimit(containerDimensions) {
      if (!containerDimensions) return;
      const availableHeight = containerDimensions.height ?? containerDimensions.maxHeight;
      if (typeof availableHeight !== "number" || !Number.isFinite(availableHeight)) return;
      // Keep enough space for title, toolbar and breathing room on fixed-height hosts.
      const previewHeight = Math.max(120, Math.min(440, availableHeight - 110));
      document.documentElement.style.setProperty("--preview-max-height", previewHeight + "px");
    }

    function captureContent(payload) {
      const value = payload?.mcp_tool_result ?? payload?.call_tool_result ?? payload?.result ?? payload;
      if (Array.isArray(value?.content)) return value.content;
      if (Array.isArray(value?.content_items)) return value.content_items;
      if (Array.isArray(value?.structuredContent?.content)) return value.structuredContent.content;
      if (Array.isArray(value)) return value;
      return [];
    }

    function updateVerificationControls() {
      if (!verificationSubmit) return;
      verificationSubmit.disabled = !activeVerification || !verificationAnswer.value.trim() ||
        !inputPoint || !confirmPoint || verificationSubmitting;
      verificationPositions.textContent =
        "입력칸: " + (inputPoint ? inputPoint.x + ", " + inputPoint.y : "미선택") +
        " / 확인 버튼: " + (confirmPoint ? confirmPoint.x + ", " + confirmPoint.y : "미선택");
    }

    function setupVerification(metadata) {
      const value = metadata?.verification;
      pausedWorkflowId = typeof metadata?.paused_workflow?.workflow_id === "string"
        ? metadata.paused_workflow.workflow_id : null;
      lastVerificationTarget = metadata?.target_id || lastVerificationTarget;
      if (!value?.required || typeof value.id !== "string" ||
          !Number.isInteger(value.viewport?.width) ||
          !Number.isInteger(value.viewport?.height)) {
        activeVerification = null;
        verificationCard.hidden = true;
        preview.classList.remove("verification-active");
        resumeAgent.hidden = metadata?.verification_status !== "completed";
        if (metadata?.verification_status === "completed") {
          verificationCard.hidden = false;
          verificationStatus.textContent = "reCAPTCHA 응답 토큰이 확인되었습니다. 다음 단계로 진행할 수 있습니다.";
          if (autoResumeOnConfirmed) void continueAgent();
        } else if (pausedWorkflowId || lastVerificationTarget) {
          verificationCard.hidden = false;
          resumeAgent.hidden = false;
          verificationStatus.textContent = "인증 화면이 보이지 않습니다. 현재 페이지가 정상인지 확인한 뒤, 보류된 작업을 재개할 수 있습니다.";
        }
        return;
      }
      lastVerificationTarget = metadata.target_id || lastVerificationTarget;
      activeVerification = value;
      resumeAgent.hidden = true;
      verificationAnswer.value = "";
      inputPoint = null;
      confirmPoint = null;
      verificationSubmitting = false;
      picking = null;
      verificationStatus.textContent = "인증 답변은 직접 입력해야 하며, 자동으로 풀지 않습니다.";
      verificationCard.hidden = false;
      updateVerificationControls();
    }

    function renderScreenshot(payload) {
      const blocks = captureContent(payload);
      const block = blocks.find((item) =>
        item?.type === "image" && (item.mimeType ?? item.mime_type) === "image/png");
      if (!block || typeof block.data !== "string" || block.data.length > 12000000 ||
          !/^[A-Za-z0-9+/]+={0,2}$/.test(block.data)) {
        if (!imageBase64) status.textContent = "PNG 이미지가 포함된 MCP 결과를 받지 못했습니다.";
        return;
      }

      imageBase64 = block.data;
      const textBlock = blocks.find((item) => item?.type === "text");
      let metadata = {};
      try { metadata = JSON.parse(textBlock?.text ?? "{}"); } catch (_) {}
      const bytes = Number.isFinite(metadata.bytes) ? metadata.bytes : Math.floor(block.data.length * .75);
      details.textContent = (bytes / 1024).toFixed(1) + " KiB";
      preview.src = "data:image/png;base64," + imageBase64;
      preview.style.display = "block";
      status.textContent = "HackBrowser 스크린샷";
      download.disabled = false;
      setupVerification(metadata);
      scheduleHeightReport();
    }

    // ChatGPT connectors may prefix tool names with a connector namespace.
    // The opening tool's real name is provided by the MCP Apps handshake.
    function setHostToolPrefix(hostContext) {
      const openingName = hostContext?.toolInfo?.tool?.name;
      const suffix = "browser_screenshot";
      if (typeof openingName === "string" && openingName.endsWith(suffix)) {
        hostToolPrefix = openingName.slice(0, -suffix.length);
      }
    }

    function toolFailure(result) {
      if (result?.isError || result?.error) {
        const text = result?.content?.find((part) => part?.type === "text")?.text;
        return text || String(result.error?.message || "MCP 도구 실행 실패");
      }
      const raw = result?.content?.find((part) => part?.type === "text")?.text;
      if (typeof raw === "string" && raw.length < 2000) {
        try {
          const obj = JSON.parse(raw);
          if (obj?.detail && /MCP Resource not found/i.test(String(obj.detail))) return obj.detail;
        } catch (_) {}
      }
      return null;
    }

    function friendlyToolError(error) {
      const message = String(error?.message ?? error ?? "");
      if (/MCP Resource not found|Unknown tool|Tool not found|not registered/i.test(message)) {
        return new Error(
          "ChatGPT의 HackBrowser 도구 목록이 이전 버전입니다. " +
          "ChatGPT 설정에서 HackBrowser 연결을 새로고침하거나 다시 연결하고, " +
          "새 채팅에서 HackBrowser를 선택해 새 캡처를 실행하세요."
        );
      }
      return error instanceof Error ? error : new Error(message || "MCP 도구 호출 실패");
    }

    // Each user click makes at most ONE tool call. Do not blindly retry a
    // verification submission: a response loss must not submit it twice.
    async function callMcpTool(name, args) {
      const toolName = hostToolPrefix + name;
      try {
        let result;
        if (hostInitialized) {
          result = await hostRequest("tools/call", { name: toolName, arguments: args });
        } else if (typeof window.openai?.callTool === "function") {
          result = await window.openai.callTool(toolName, args);
        } else {
          throw new Error("이 채팅 환경에서는 MCP 도구 호출을 지원하지 않습니다.");
        }
        const failure = toolFailure(result);
        if (failure) throw new Error(failure);
        return result;
      } catch (error) {
        throw friendlyToolError(error);
      }
    }

    async function refreshCapture() {
      const target = lastVerificationTarget;
      const result = await callMcpTool("browser_screenshot", target ? { target_id: target } : {});
      if (result?.isError || result?.error) throw new Error("화면 캡처를 새로 가져오지 못했습니다.");
      renderScreenshot(result);
    }

    async function continueAgent() {
      if (continueRequested) return;
      continueRequested = true;
      autoResumeOnConfirmed = false;
      resumeAgent.disabled = true;
      const prompt = pausedWorkflowId
        ? "사용자가 HackBrowser의 수동 인증을 마쳤습니다. browser_workflow_status 도구로 작업 " +
          pausedWorkflowId + " 의 현재 상태를 확인하고 browser_tabs/browser_page_text로 " +
          "인증 화면이 사라졌는지 검증하세요. 인증이 남아 있으면 다시 요청하고, " +
          "완료된 경우에만 browser_workflow_resume(workflow_id='" + pausedWorkflowId +
          "')로 다음 안전한 단계부터 재개하세요. 성공을 가정하거나 인증을 자동 해결하지 마세요."
        : "HackBrowser에서 사용자가 CAPTCHA 확인을 완료했습니다. 현재 GUI Chromium 탭을 browser_tabs와 browser_page_text로 확인하고, 이전에 요청한 브라우저 작업을 계속하세요. 인증 성공을 가정하지 말고 화면 상태를 검증하세요. 필요하면 다시 사용자 인증을 요청하세요.";
      try {
        if (typeof window.openai?.sendFollowUpMessage === "function") {
          await window.openai.sendFollowUpMessage({ prompt });
        } else if (hostInitialized) {
          await hostRequest("ui/message", { role: "user", content: [{ type: "text", text: prompt }] });
        } else {
          throw new Error("자동 후속 메시지를 지원하지 않습니다. 채팅에서 '인증 확인 후 계속해줘'라고 입력하세요.");
        }
        verificationStatus.textContent = "ChatGPT에 페이지 재확인 및 작업 재개를 요청했습니다.";
      } catch (error) {
        continueRequested = false;
        resumeAgent.disabled = false;
        verificationStatus.textContent = error?.message || "작업 재개 메시지 전송 실패";
      }
    }

    refreshVerification.addEventListener("click", async () => {
      refreshVerification.disabled = true;
      try { await refreshCapture(); }
      catch (error) { verificationStatus.textContent = error?.message || "캡처 갱신 실패"; }
      finally { refreshVerification.disabled = false; }
    });
    resumeAgent.addEventListener("click", () => { void continueAgent(); });
    pickTile.addEventListener("click", () => {
      if (!activeVerification || verificationSubmitting) return;
      picking = "tile";
      preview.classList.add("verification-active");
      verificationStatus.textContent = "CAPTCHA 이미지에서 선택할 위치를 한 번 클릭하세요.";
    });

    preview.addEventListener("load", scheduleHeightReport);
    pickInput.addEventListener("click", () => {
      if (!activeVerification) return;
      picking = "input";
      preview.classList.add("verification-active");
      verificationStatus.textContent = "스크린샷에서 답을 입력할 위치를 클릭하세요.";
    });
    pickConfirm.addEventListener("click", () => {
      if (!activeVerification) return;
      picking = "confirm";
      preview.classList.add("verification-active");
      verificationStatus.textContent = "스크린샷에서 인증 확인 버튼 위치를 클릭하세요.";
    });
    preview.addEventListener("click", async (event) => {
      if (!picking || !activeVerification) return;
      const rect = preview.getBoundingClientRect();
      const scale = Math.min(
        rect.width / activeVerification.viewport.width,
        rect.height / activeVerification.viewport.height
      );
      if (!(scale > 0)) return;
      const displayedWidth = activeVerification.viewport.width * scale;
      const displayedHeight = activeVerification.viewport.height * scale;
      const offsetX = (rect.width - displayedWidth) / 2;
      const offsetY = (rect.height - displayedHeight) / 2;
      const x = Math.floor((event.clientX - rect.left - offsetX) / scale);
      const y = Math.floor((event.clientY - rect.top - offsetY) / scale);
      if (x < 0 || y < 0 || x >= activeVerification.viewport.width ||
          y >= activeVerification.viewport.height) {
        verificationStatus.textContent = "이미지 내부의 위치를 클릭하세요.";
        return;
      }
      if (picking === "tile") {
        picking = null;
        preview.classList.remove("verification-active");
        verificationSubmitting = true;
        updateVerificationControls();
        verificationStatus.textContent = "선택한 위치를 GUI Chromium에 전달 중입니다...";
        try {
          const result = await callMcpTool("browser_verification_click", {
            verification_id: activeVerification.id, x, y,
          });
          if (result?.isError || result?.error) throw new Error("선택 위치를 전달하지 못했습니다.");
          autoResumeOnConfirmed = true;
          await refreshCapture();
        } catch (error) {
          verificationStatus.textContent = error?.message || "클릭 실패: 캡처를 갱신하세요.";
        } finally {
          verificationSubmitting = false;
          updateVerificationControls();
          scheduleHeightReport();
        }
        return;
      }
      if (picking === "input") inputPoint = { x, y };
      else confirmPoint = { x, y };
      picking = null;
      preview.classList.remove("verification-active");
      verificationStatus.textContent = "위치가 지정됐습니다.";
      updateVerificationControls();
    });
    verificationAnswer.addEventListener("input", updateVerificationControls);
    verificationSubmit.addEventListener("click", async () => {
      if (verificationSubmit.disabled || verificationSubmitting ||
          !activeVerification || !inputPoint || !confirmPoint) return;
      const answer = verificationAnswer.value.trim();
      if (!answer || answer.length > 64 || /[\x00-\x1F\x7F]/.test(answer)) {
        verificationStatus.textContent = "유효한 한 줄 답변을 입력하세요.";
        return;
      }
      verificationSubmitting = true;
      updateVerificationControls();
      verificationStatus.textContent = "OCI 브라우저에 인증 답변을 전달하고 있습니다...";
      const args = {
        verification_id: activeVerification.id,
        answer,
        input_x: inputPoint.x, input_y: inputPoint.y,
        confirm_x: confirmPoint.x, confirm_y: confirmPoint.y,
      };
      // The answer is sent only after an explicit click, never by an effect.
      try {
        const result = await callMcpTool("browser_submit_verification", args);
        if (result?.isError || result?.error) {
          throw new Error("브라우저가 제출을 거부했습니다. 새 캡처를 진행하세요.");
        }
        // Consume the card once. The normal page inspection determines
        // whether the human answer was accepted by the target website.
        verificationAnswer.value = "";
        activeVerification = null;
        verificationStatus.textContent = "답변을 한 번 제출했습니다. 인증 결과를 확인합니다.";
        autoResumeOnConfirmed = true;
        await refreshCapture();
      } catch (error) {
        // An error may have happened before routing or after a successful
        // one-time delivery. Preserve the visible answer for reference but
        // prevent accidental duplicate submission until a fresh capture.
        activeVerification = null;
        verificationSubmit.disabled = true;
        verificationStatus.textContent =
          (error?.message || "제출에 실패했습니다.") +
          " 중복 제출하지 말고 연결 상태를 확인한 뒤 새 캡처를 실행하세요.";
      } finally {
        verificationSubmitting = false;
        picking = null;
        preview.classList.remove("verification-active");
        updateVerificationControls();
        scheduleHeightReport();
      }
    });
    preview.addEventListener("error", () => {
      status.textContent = "이 호스트가 인라인 PNG 표시를 제한했습니다. 다운로드 기능을 이용하세요.";
      preview.style.display = "none";
      scheduleHeightReport();
    });

    function pngFile() {
      if (!imageBase64) throw new Error("이미지가 없습니다.");
      const binary = atob(imageBase64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; ++i) bytes[i] = binary.charCodeAt(i);
      return new File([bytes], "hackbrowser-screenshot.png", { type: "image/png" });
    }

    // Sandboxed MCP Apps cannot rely on a synthetic anchor click. Ask the
    // host to save the embedded PNG using the standard ui/download-file RPC.
    function hostRequest(method, params) {
      return new Promise((resolve, reject) => {
        const id = nextRequestId++;
        const timeout = setTimeout(() => {
          pendingRequests.delete(id);
          reject(new Error("호스트 응답 시간 초과"));
        }, 7000);
        pendingRequests.set(id, { resolve, reject, timeout });
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      });
    }

    async function saveWithHost() {
      const response = await hostRequest("ui/download-file", {
        contents: [{
          type: "resource",
          resource: {
            uri: "file:///hackbrowser-screenshot.png",
            mimeType: "image/png",
            blob: imageBase64,
          },
        }],
      });
      if (response?.isError) throw new Error("호스트가 다운로드를 거부했습니다.");
    }

    async function saveWithChatGPT() {
      const api = window.openai;
      if (typeof api?.uploadFile !== "function" ||
          typeof api?.getFileDownloadUrl !== "function" ||
          typeof api?.openExternal !== "function") {
        throw new Error("이 채팅 환경은 PNG 파일 다운로드를 지원하지 않습니다.");
      }
      const uploaded = await api.uploadFile(pngFile());
      if (!uploaded?.fileId) throw new Error("ChatGPT 파일 업로드 실패");
      const link = await api.getFileDownloadUrl({ fileId: uploaded.fileId });
      if (typeof link?.downloadUrl !== "string" ||
          !link.downloadUrl.startsWith("https://")) {
        throw new Error("다운로드 링크를 발급받지 못했습니다.");
      }
      await api.openExternal({ href: link.downloadUrl, redirectUrl: false });
    }

    download.addEventListener("click", async () => {
      if (!imageBase64 || download.disabled) return;
      download.disabled = true;
      status.textContent = "PNG 다운로드 요청 중...";
      try {
        if (hostSupportsDownload !== false) {
          try {
            await saveWithHost();
          } catch (hostError) {
            if (hostSupportsDownload === true) throw hostError;
            await saveWithChatGPT();
          }
        } else {
          await saveWithChatGPT();
        }
        status.textContent = "다운로드 요청을 전달했습니다.";
      } catch (error) {
        status.textContent = error?.message || "PNG 다운로드에 실패했습니다.";
      } finally {
        download.disabled = false;
        scheduleHeightReport();
      }
    });

    // Standard MCP Apps postMessage transport.
    window.addEventListener("message", (event) => {
      if (event.source !== window.parent || event.data?.jsonrpc !== "2.0") return;
      const message = event.data;
      if (pendingRequests.has(message.id)) {
        const pending = pendingRequests.get(message.id);
        pendingRequests.delete(message.id);
        clearTimeout(pending.timeout);
        if (message.error) pending.reject(new Error(message.error.message || "다운로드 거부"));
        else pending.resolve(message.result);
        return;
      }
      if (message.id === 1 && message.result?.protocolVersion) {
        hostSupportsDownload = message.result.hostCapabilities?.downloadFile !== undefined
          ? true
          : (message.result.hostCapabilities ? false : null);
        applyHostHeightLimit(message.result.hostContext?.containerDimensions);
        setHostToolPrefix(message.result.hostContext);
        hostInitialized = true;
        window.parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized" }, "*");
        scheduleHeightReport();
        return;
      }
      if (message.method === "ui/notifications/tool-result") renderScreenshot(message.params);
      if (message.method === "ui/notifications/host-context-changed") {
        applyHostHeightLimit(message.params?.containerDimensions);
        setHostToolPrefix(message.params);
        scheduleHeightReport();
      }
    });

    window.parent.postMessage({
      jsonrpc: "2.0",
      id: 1,
      method: "ui/initialize",
      params: {
        appInfo: { name: "HackBrowser Screenshot", version: "1.0.0" },
        appCapabilities: {},
        protocolVersion: "2026-01-26",
      },
    }, "*");

    // Optional ChatGPT bridge fallback (the full tool result is in metadata).
    const current = window.openai?.toolResponseMetadata?.mcp_tool_result ??
                    window.openai?.toolResponseMetadata?.call_tool_result ??
                    window.openai?.toolOutput;
    if (current) renderScreenshot(current);
  </script>
</body>
</html>
